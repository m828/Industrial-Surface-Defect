# Protocol-compliant NEU-Seg baseline: PIDNet-S, 240k iters.
# Protocol: from scratch, seed 1337, Adam lr=1e-4 constant (no schedule), wd=2e-6,
# batch 16, 200x200, 4 classes, NO val/test during training, checkpoint only at final iter.
model:
  arch: pidnet_s
data:
  dataset: neu
  num_classes: 4
  train_list: /workspace/Industrial Surface Defect/new (copy)/dataset/train_neu.txt
  data_dir: /workspace/Industrial Surface Defect/new (copy)
  input_hw: [200, 200]
training:
  train_iters: 240000
  batch_size: 16
  n_workers: 8
  print_interval: 100
  seed: 1337
  optimizer:
    name: adam
    lr: 1.0e-4
    weight_decay: 2.0e-6
  # chain loss habit: 2x ohem_cross_entropy on the two supervised outputs, weights [1.0, 0.4]
  loss:
    - name: ohem_cross_entropy
    - name: ohem_cross_entropy
  loss_weights: [1.0, 0.4]
  lr_schedule: null   # ConstantLR (protocol: constant LR)
  resume: null
experiment:
  run_prefix: neu_pidnet_240k
  checkpoint_dir: /workspace/Industrial Surface Defect/repro_runs/baseline_neu_240k/checkpoints
  result_dir: /workspace/Industrial Surface Defect/repro_runs/baseline_neu_240k/results
  log_dir: /workspace/Industrial Surface Defect/repro_runs/baseline_neu_240k/logs
