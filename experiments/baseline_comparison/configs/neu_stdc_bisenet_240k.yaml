# Protocol-compliant NEU-Seg baseline: STDC-Seg (BiSeNet + STDCNet1446), 240k iters.
# Protocol: from scratch, seed 1337, Adam lr=1e-4 constant (no schedule), wd=2e-6,
# batch 16, 200x200, 4 classes, NO val/test during training, checkpoint only at final iter.
model:
  arch: stdc_seg
data:
  dataset: neu
  num_classes: 4
  train_list: /workspace/Industrial Surface Defect/new (copy)/dataset/train_neu.txt
  data_dir: /workspace/Industrial Surface Defect/new (copy)
  input_hw: [200, 200]
training:
  train_iters: 240000
  batch_size: 16
  n_workers: 8
  print_interval: 100
  seed: 1337
  optimizer:
    name: adam
    lr: 1.0e-4
    weight_decay: 2.0e-6
  # multi-output supervision: [main CE, aux16 CE, aux32 CE, boundary BCE-vs-binary-mask]
  loss_weights: [1.0, 1.0, 1.0, 1.0]
  lr_schedule: null   # ConstantLR (protocol: constant LR)
  resume: null
experiment:
  run_prefix: neu_stdc_bisenet_240k
  checkpoint_dir: /workspace/Industrial Surface Defect/repro_runs/baseline_neu_240k/stdc/checkpoints
  result_dir: /workspace/Industrial Surface Defect/repro_runs/baseline_neu_240k/stdc/results
  log_dir: /workspace/Industrial Surface Defect/repro_runs/baseline_neu_240k/stdc/logs
